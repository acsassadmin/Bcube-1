[build]
  publish = "dist"

[build.environment]
  # These values are public by design (they ship in the browser bundle or are
  # public identifiers), so secrets scanning should not treat them as leaks.
  # Server-only secrets (RAZORPAY_KEY_SECRET, SUPABASE_SERVICE_ROLE_KEY) are
  # intentionally NOT listed here and remain protected by the scanner.
  SECRETS_SCAN_OMIT_KEYS = "RAZORPAY_KEY_ID,VITE_RAZORPAY_KEY_ID,SUPABASE_URL,VITE_SUPABASE_URL,SUPABASE_PROJECT_ID,VITE_SUPABASE_PROJECT_ID,SUPABASE_PUBLISHABLE_KEY,VITE_SUPABASE_PUBLISHABLE_KEY,VITE_MEDIA_BASE_URL"
